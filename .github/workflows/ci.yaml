name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.4)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: make test

  build-and-push:
    needs: test
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      operator-image: ${{ steps.tags.outputs.operator_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image tags
        id: tags
        run: |
          REPO=quay.io/mathianasj/mirror-operator
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "tags=${REPO}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${REPO}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=${REPO}:latest,${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}

  bundle-and-catalog:
    needs: build-and-push
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install operator-sdk
        run: |
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -sSLo operator-sdk https://github.com/operator-framework/operator-sdk/releases/download/v1.39.2/operator-sdk_${OS}_${ARCH}
          chmod +x operator-sdk
          sudo mv operator-sdk /usr/local/bin/

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image variables
        id: vars
        run: |
          REPO=quay.io/mathianasj/mirror-operator
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "dev_channel=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "dev_channel=" >> "$GITHUB_OUTPUT"
          else
            CURRENT_VERSION=$(grep '^VERSION ?=' Makefile | sed 's/VERSION ?= //')
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            TIMESTAMP=$(date +%s)
            DEV_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-${BRANCH}.${TIMESTAMP}"
            echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:${DEV_VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=" >> "$GITHUB_OUTPUT"
            echo "dev_channel=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "img=${{ needs.build-and-push.outputs.operator-image }}" >> "$GITHUB_OUTPUT"

      - name: Generate bundle
        run: make bundle IMG=${{ steps.vars.outputs.img }} VERSION=${{ steps.vars.outputs.version }}

      - name: Validate bundle relatedImages
        run: operator-sdk bundle validate ./bundle --select-optional suite=operatorframework

      - name: Build and push bundle image
        run: |
          make bundle-build BUNDLE_IMG=${{ steps.vars.outputs.bundle_img }}
          make bundle-push BUNDLE_IMG=${{ steps.vars.outputs.bundle_img }}

      - name: Fix containers registries config
        run: |
          sudo mkdir -p /etc/containers
          echo 'unqualified-search-registries = ["docker.io"]' | sudo tee /etc/containers/registries.conf

      - name: Build and push catalog image (FBC)
        run: |
          if [ -n "${{ steps.vars.outputs.dev_channel }}" ]; then
            make catalog-build \
              CATALOG_IMG=${{ steps.vars.outputs.catalog_img }} \
              BUNDLE_IMGS=${{ steps.vars.outputs.bundle_img }} \
              DEV_CHANNEL=${{ steps.vars.outputs.dev_channel }} \
              VERSION=${{ steps.vars.outputs.version }}
          else
            make catalog-build \
              CATALOG_IMG=${{ steps.vars.outputs.catalog_img }} \
              VERSION=${{ steps.vars.outputs.version }}
          fi
          make catalog-push CATALOG_IMG=${{ steps.vars.outputs.catalog_img }}
          if [ -n "${{ steps.vars.outputs.catalog_img_latest }}" ]; then
            docker tag ${{ steps.vars.outputs.catalog_img }} ${{ steps.vars.outputs.catalog_img_latest }}
            make catalog-push CATALOG_IMG=${{ steps.vars.outputs.catalog_img_latest }}
          fi
          make catalog-clean
