name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.4)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: make test

  build-and-push:
    needs: test
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      operator-image: ${{ steps.tags.outputs.operator_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image tags
        id: tags
        run: |
          REPO=quay.io/mathianasj/mirror-operator
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "tags=${REPO}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${REPO}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=${REPO}:latest,${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "operator_image=${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'latest' }}

  build-and-push-architect-images:
    needs: test
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: frontend
            context: frontend
            containerfile: frontend/Containerfile
            image: quay.io/mathianasj/openshift-airgap-architect-frontend
          - name: backend
            context: .
            containerfile: backend/Containerfile
            image: quay.io/mathianasj/openshift-airgap-architect-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - name: Read pinned architect ref and repo from Makefile
        id: arch-ref
        run: |
          REF=$(grep '^ARCHITECT_REF' Makefile | awk '{print $3}')
          REPO=$(grep '^ARCHITECT_REPO' Makefile | awk '{print $3}')
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Clone architect repo at pinned ref
        run: |
          git clone --depth 1 --branch ${{ steps.arch-ref.outputs.ref }} \
            ${{ steps.arch-ref.outputs.repo }} architect-src

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image tags
        id: tags
        run: |
          REPO=${{ matrix.component.image }}
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "tags=${REPO}:${{ inputs.version }},${REPO}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${REPO}:${{ github.ref_name }},${REPO}:latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=${REPO}:latest,${REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: architect-src/${{ matrix.component.context }}
          file: architect-src/${{ matrix.component.containerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}

  build-and-push-console-plugin:
    needs: test
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console-plugin/package-lock.json

      - name: Build plugin dist
        working-directory: console-plugin
        run: npm ci && npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image tags
        id: plugin-tags
        run: |
          TAG_SUFFIX=""
          if [[ -n "${{ inputs.version }}" ]]; then
            TAG_SUFFIX="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_SUFFIX="${{ github.ref_name }}"
          else
            TAG_SUFFIX="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          NGINX_REPO=quay.io/mathianasj/openshift-airgap-architect-console-plugin
          BACKEND_REPO=quay.io/mathianasj/openshift-airgap-architect-console-plugin-backend
          echo "nginx_tags=${NGINX_REPO}:${TAG_SUFFIX},${NGINX_REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "backend_tags=${BACKEND_REPO}:${TAG_SUFFIX},${BACKEND_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push nginx (static dist) image
        uses: docker/build-push-action@v6
        with:
          context: console-plugin
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plugin-tags.outputs.nginx_tags }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Build and push backend (Express API) sidecar image
        uses: docker/build-push-action@v6
        with:
          context: console-plugin/server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plugin-tags.outputs.backend_tags }}

  bundle-and-catalog:
    needs: build-and-push
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install operator-sdk
        run: |
          OS=$(go env GOOS)
          ARCH=$(go env GOARCH)
          curl -sSLo operator-sdk https://github.com/operator-framework/operator-sdk/releases/download/v1.39.2/operator-sdk_${OS}_${ARCH}
          chmod +x operator-sdk
          sudo mv operator-sdk /usr/local/bin/

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set image variables
        id: vars
        run: |
          REPO=quay.io/mathianasj/mirror-operator
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "dev_channel=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "dev_channel=" >> "$GITHUB_OUTPUT"
          else
            CURRENT_VERSION=$(grep '^VERSION ?=' Makefile | sed 's/VERSION ?= //')
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            TIMESTAMP=$(date +%s)
            DEV_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-${BRANCH}.${TIMESTAMP}"
            echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
            echo "bundle_img=${REPO}-bundle:${DEV_VERSION}" >> "$GITHUB_OUTPUT"
            echo "catalog_img=${REPO}-catalog:latest" >> "$GITHUB_OUTPUT"
            echo "catalog_img_latest=" >> "$GITHUB_OUTPUT"
            echo "dev_channel=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "img=${{ needs.build-and-push.outputs.operator-image }}" >> "$GITHUB_OUTPUT"

      - name: Generate bundle
        run: make bundle IMG=${{ steps.vars.outputs.img }} VERSION=${{ steps.vars.outputs.version }}

      - name: Validate bundle relatedImages
        run: operator-sdk bundle validate ./bundle --select-optional suite=operatorframework

      - name: Build and push bundle image
        run: |
          make bundle-build BUNDLE_IMG=${{ steps.vars.outputs.bundle_img }}
          make bundle-push BUNDLE_IMG=${{ steps.vars.outputs.bundle_img }}

      - name: Fix containers registries config
        run: |
          sudo mkdir -p /etc/containers
          echo 'unqualified-search-registries = ["docker.io"]' | sudo tee /etc/containers/registries.conf

      - name: Build and push catalog image (FBC)
        run: |
          if [ -n "${{ steps.vars.outputs.dev_channel }}" ]; then
            make catalog-build \
              CATALOG_IMG=${{ steps.vars.outputs.catalog_img }} \
              BUNDLE_IMGS=${{ steps.vars.outputs.bundle_img }} \
              DEV_CHANNEL=${{ steps.vars.outputs.dev_channel }} \
              VERSION=${{ steps.vars.outputs.version }}
          else
            make catalog-build \
              CATALOG_IMG=${{ steps.vars.outputs.catalog_img }} \
              VERSION=${{ steps.vars.outputs.version }}
          fi
          make catalog-push CATALOG_IMG=${{ steps.vars.outputs.catalog_img }}
          if [ -n "${{ steps.vars.outputs.catalog_img_latest }}" ]; then
            docker tag ${{ steps.vars.outputs.catalog_img }} ${{ steps.vars.outputs.catalog_img_latest }}
            make catalog-push CATALOG_IMG=${{ steps.vars.outputs.catalog_img_latest }}
          fi
          make catalog-clean
