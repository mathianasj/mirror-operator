name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.1.3)'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release VERSION=${{ inputs.version }}

  build:
    needs: release
    uses: ./.github/workflows/ci.yaml
    with:
      version: v${{ inputs.version }}
    secrets: inherit

  submit-to-operatorhub:
    needs: build
    uses: ./.github/workflows/operator-catalog-pr.yaml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
