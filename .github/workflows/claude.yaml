name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          use_vertex: "true"
          trigger_phrase: "@claude"
          create_pull_request: "true"
          custom_instructions: |
            Always write unit tests for any code changes. Use the existing test patterns
            in *_test.go files. Run 'make test' to verify tests pass before committing.
            If modifying controller logic, add corresponding test cases in the controller's
            test file using envtest and Ginkgo/Gomega conventions.
        env:
          CLOUD_ML_REGION: ${{ secrets.GCP_REGION }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
