apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-mirror-registry
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /opt/quay/quay-config/config.yaml
          mode: 0644
          overwrite: true
          contents:
            source: "data:text/plain;base64,"
        - path: /opt/quay/auth.json
          mode: 0600
          overwrite: true
          contents:
            source: "data:text/plain;base64,eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbTo4NDQzIjp7ImF1dGgiOiJkWE5sY2pwd1lYTnpkMjl5WkE9PSJ9fX0="
        - path: /usr/local/bin/mirror-registry-init.sh
          mode: 0755
          overwrite: true
          contents:
            source: "data:text/plain;base64,"
    systemd:
      units:
        - name: mirror-registry-init.service
          enabled: true
          contents: |
            [Unit]
            Description=Initialize Mirror Registry (TLS, volumes, secrets)
            After=network-online.target
            Wants=network-online.target
            Before=mirror-registry-pod.service
            ConditionPathExists=!/opt/quay/quay-config/ssl.cert

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/local/bin/mirror-registry-init.sh

            [Install]
            WantedBy=multi-user.target

        - name: mirror-registry-pod.service
          enabled: true
          contents: |
            [Unit]
            Description=Mirror Registry Pod
            After=network-online.target mirror-registry-init.service
            Wants=network-online.target
            Requires=mirror-registry-init.service
            Before=kubelet.service crio.service

            [Service]
            Type=simple
            RemainAfterExit=yes
            TimeoutStartSec=5m
            ExecStartPre=-/usr/bin/podman pod stop quay-pod
            ExecStartPre=-/usr/bin/podman pod rm -f quay-pod
            ExecStartPre=/usr/bin/podman pull --tls-verify=false --authfile /opt/quay/auth.json registry.example.com:8443/mirror-registry/pause:8.10-5
            ExecStart=/usr/bin/podman pod create \
                --name quay-pod \
                --infra-image registry.example.com:8443/mirror-registry/pause:8.10-5 \
                --publish 8443:8443 \
                --replace
            ExecStop=-/usr/bin/podman pod stop quay-pod -t 10
            ExecStopPost=-/usr/bin/podman pod rm -f quay-pod
            Restart=always
            RestartSec=30

            [Install]
            WantedBy=multi-user.target

        - name: mirror-registry-redis.service
          enabled: true
          contents: |
            [Unit]
            Description=Mirror Registry Redis
            After=network-online.target mirror-registry-pod.service
            Wants=network-online.target
            Requires=mirror-registry-pod.service
            Before=mirror-registry-app.service kubelet.service crio.service

            [Service]
            Type=simple
            TimeoutStartSec=5m
            ExecStartPre=-/usr/bin/podman stop quay-redis
            ExecStartPre=-/usr/bin/podman rm -f quay-redis
            ExecStartPre=/usr/bin/podman pull --tls-verify=false --authfile /opt/quay/auth.json registry.example.com:8443/mirror-registry/redis-6:1-1766406130
            ExecStart=/usr/bin/podman run \
                --name quay-redis \
                --pod=quay-pod \
                --secret=redis_pass,type=env,target=REDIS_PASSWORD \
                --replace \
                registry.example.com:8443/mirror-registry/redis-6:1-1766406130
            ExecStop=-/usr/bin/podman stop quay-redis -t 10
            ExecStopPost=-/usr/bin/podman rm -f quay-redis
            Restart=always
            RestartSec=30

            [Install]
            WantedBy=multi-user.target

        - name: mirror-registry-app.service
          enabled: true
          contents: |
            [Unit]
            Description=Mirror Registry Quay
            After=network-online.target mirror-registry-redis.service
            Wants=network-online.target
            Requires=mirror-registry-pod.service mirror-registry-redis.service
            Before=kubelet.service crio.service

            [Service]
            Type=simple
            TimeoutStartSec=5m
            ExecStartPre=-/usr/bin/podman stop quay-app
            ExecStartPre=-/usr/bin/podman rm -f quay-app
            ExecStartPre=/usr/bin/podman pull --tls-verify=false --authfile /opt/quay/auth.json registry.example.com:8443/mirror-registry/quay-rhel8:v3.12.21
            ExecStart=/usr/bin/podman run \
                --name quay-app \
                -v /opt/quay/quay-config:/quay-registry/conf/stack \
                -v sqlite-storage:/sqlite:Z,U \
                -v quay-storage:/datastorage:Z \
                --pod=quay-pod \
                --replace \
                -e WORKER_COUNT_UNSUPPORTED_MINIMUM=1 \
                -e WORKER_COUNT=1 \
                -e PYTHONUSERBASE_SITE_PACKAGE=/opt/app-root/lib/python3.12/site-packages \
                registry.example.com:8443/mirror-registry/quay-rhel8:v3.12.21 registry
            ExecStop=-/usr/bin/podman stop quay-app -t 10
            ExecStopPost=-/usr/bin/podman rm -f quay-app
            Restart=always
            RestartSec=30

            [Install]
            WantedBy=multi-user.target
