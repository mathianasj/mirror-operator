apiVersion: mirror.mirror.mathianasj.github.com/v1
kind: DisconnectedPlatform
metadata:
  labels:
    app.kubernetes.io/name: mirror-operator
    app.kubernetes.io/managed-by: kustomize
  name: disconnected-platform-airgapped
spec:
  mode: airgapped
  airgapped:
    managementCluster: true
    bootstrapEnabled: true
    importPath: /mnt/physical-media
    importScanSchedule: "*/30 * * * *"
    quay:
      enabled: true
      organizationName: mirror
      storage:
        size: 500Gi
    acm:
      enabled: true
      subscription:
        catalogSource: cs-redhat-operator-index
        channel: release-2.12
      multiClusterHub:
        imagePullSecret:
          name: pull-secret
    rhtas:
      trustedRootKeys:
        name: rhtas-trusted-root
  architect:
    enabled: true
    frontendImage: quay.io/mathianasj/openshift-airgap-architect-frontend:latest
    backendImage: quay.io/mathianasj/openshift-airgap-architect-backend:latest
    replicas: 1
    route:
      tls:
        termination: edge
    # Optional: specify custom pull secret (defaults to openshift-config/pull-secret)
    # pullSecret:
    #   name: my-custom-pull-secret
