apiVersion: mirror.mirror.mathianasj.github.com/v1
kind: DisconnectedPlatform
metadata:
  labels:
    app.kubernetes.io/name: mirror-operator
    app.kubernetes.io/managed-by: kustomize
  name: disconnected-platform
spec:
  mode: connected
  connected:
    collectionSchedule: "0 2 * * 0"
    mirrorRegistry: "quay.example.com/mirror"
    artifactStorage:
      size: 200Gi
    triggerTypes:
      - scheduled
      - manual
    operators:
      openshiftPipelines: {}
      rhtas: {}
      rhtpa: {}
    rhtas:
      oidc:
        managed:
          enabled: true
          realm: trusted-artifact-signer
    rhtpa:
      storage:
        type: local
        size: 200Gi
      database:
        host: postgres.example.com
        name: rhtpa
        username: rhtpa
        password: change-me
  architect:
    enabled: true
    # Optional: image overrides. Defaults are set from the operator's relatedImages.
    frontendImage: quay.io/mathianasj/openshift-airgap-architect-frontend:latest
    backendImage: quay.io/mathianasj/openshift-airgap-architect-backend:latest
