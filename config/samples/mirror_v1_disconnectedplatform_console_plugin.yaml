apiVersion: mirror.mirror.mathianasj.github.com/v1
kind: DisconnectedPlatform
metadata:
  name: disconnectedplatform-console-plugin
  namespace: mirror-operator-system
spec:
  mode: connected
  connected:
    collectionSchedule: "0 2 * * 0"  # Weekly at 2 AM on Sunday
    artifactStorage:
      size: "500Gi"
      storageClass: "gp3-csi"
    operators:
      openshiftPipelines:
        disabled: false
        channel: "latest"
  # Airgap Architect with OpenShift Console Plugin enabled
  architect:
    enabled: true
    # Optional: image overrides. Defaults are set from the operator's relatedImages.
    backendImage: "quay.io/mathianasj/openshift-airgap-architect-backend:latest"
    # Enable console plugin mode (replaces standalone frontend)
    consolePlugin:
      enabled: true
      image: "quay.io/mathianasj/openshift-airgap-architect-console-plugin:latest"
    # Optional: custom route configuration for backend API
    # route:
    #   host: "airgap-architect-api.apps.example.com"
    #   tls:
    #     termination: edge
---
# The operator automatically registers and enables the console plugin.
# After deploying, refresh the OpenShift Console and navigate to:
# Administrator → Airgap Architect
#
# The console plugin works on both connected and airgapped clusters.
# On connected clusters, the standalone frontend and routes are skipped —
# the console plugin provides the integrated management UI instead.
